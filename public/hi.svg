<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Saffron -->
  <rect width="900" height="200" fill="#FF9933"/>
  
  <!-- White -->
  <rect y="200" width="900" height="200" fill="#FFFFFF"/>
  
  <!-- Green -->
  <rect y="400" width="900" height="200" fill="#138808"/>

  <!-- Ashoka Chakra -->
  <circle cx="450" cy="300" r="90" fill="none" stroke="#000080" stroke-width="6"/>

  <!-- 24 Spokes -->
  <g stroke="#000080" stroke-width="4">
    <!-- Create one line and rotate it 24 times -->
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(0 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(15 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(30 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(45 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(60 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(75 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(90 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(105 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(120 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(135 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(150 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(165 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(180 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(195 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(210 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(225 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(240 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(255 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(270 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(285 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(300 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(315 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(330 450 300)"/>
    <line x1="450" y1="210" x2="450" y2="390" transform="rotate(345 450 300)"/>
  </g>
</svg>
